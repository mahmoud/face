name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp
      - name: Validate version
        run: |
          VERSION="${{ steps.baipp.outputs.package_version }}"
          echo "Package version: $VERSION"
          if echo "$VERSION" | grep -qi 'dev'; then
            echo "::error::Version $VERSION contains dev suffix."
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package version ($VERSION)"
            exit 1
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/face
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            if curl -s -f "https://pypi.org/pypi/face/$TAG/json" > /dev/null; then
              echo "face $TAG available on PyPI"
              break
            fi
            echo "Waiting for PyPI propagation (attempt $i/30)..."
            sleep 10
          done
      - name: Install from PyPI and verify
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          uv pip install --system face==$TAG --index-url https://pypi.org/simple/
          INSTALLED=$(cd /tmp && python -c "import face; print(face.__version__)")
          echo "Installed version: $INSTALLED"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "::error::Installed version $INSTALLED does not match tag $TAG"
            exit 1
          fi
      - name: Run tests
        run: |
          uv pip install --system pytest boltons
          pytest face/test/ -v
