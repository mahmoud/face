name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp
      - name: Validate version
        run: |
          VERSION="${{ steps.baipp.outputs.package_version }}"
          echo "Package version: $VERSION"
          if echo "$VERSION" | grep -qi 'dev'; then
            echo "::error::Version $VERSION contains dev suffix."
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package version ($VERSION)"
            exit 1
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/face
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            if curl -s -f "https://pypi.org/pypi/face/$TAG/json" > /dev/null; then
              echo "face $TAG available on PyPI"
              break
            fi
            echo "Waiting for PyPI propagation (attempt $i/30)..."
            sleep 10
          done
      - name: Install from PyPI and verify
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          uv pip install --system face==$TAG --index-url https://pypi.org/simple/
          INSTALLED=$(cd /tmp && python -c "import face; print(face.__version__)")
          echo "Installed version: $INSTALLED"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "::error::Installed version $INSTALLED does not match tag $TAG"
            exit 1
          fi
      - name: Run tests
        run: |
          uv pip install --system pytest boltons
          pytest face/test/ -v
