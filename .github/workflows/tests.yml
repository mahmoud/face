name: Tests
on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, python: "3.14", os: ubuntu-latest, tox: py314 }
          - { name: Windows, python: "3.14", os: windows-latest, tox: py314 }
          - { name: Mac, python: "3.14", os: macos-latest, tox: py314 }
          - { name: "Linux 3.13", python: "3.13", os: ubuntu-latest, tox: py313 }
          - { name: "Windows 3.13", python: "3.13", os: windows-latest, tox: py313 }
          - { name: "Mac 3.13", python: "3.13", os: macos-latest, tox: py313 }
          - { name: "3.12", python: "3.12", os: ubuntu-latest, tox: py312 }
          - { name: "3.11", python: "3.11", os: ubuntu-latest, tox: py311 }
          - { name: "3.10", python: "3.10", os: ubuntu-latest, tox: py310 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: uvx --with tox-uv tox -e ${{ matrix.tox }}
      - name: Generate coverage XML
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install --system coverage[toml]
          cd .tox && coverage combine --rcfile ../pyproject.toml && coverage xml --rcfile ../pyproject.toml -o coverage-${{ matrix.tox }}.xml
      # Dependabot PRs read from the `dependabot` secret store, so
      # CODECOV_TOKEN is absent there; skip rather than fail on a tokenless
      # upload. Coverage on a pinned-action bump carries no signal anyway.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: .tox/coverage-${{ matrix.tox }}.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  # The test matrix above resolves dev dependencies fresh, on purpose, so
  # upstream breakage surfaces early. This job is the counterweight: it proves
  # uv.lock is still coherent with pyproject.toml and that the locked
  # environment actually works, which is what makes committing the lock worth
  # anything. `uv sync --locked` fails rather than silently relocking.
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync pytest face/test/ -q
